name: Share a theme
description: Share a theme you made with the community
labels: [theme]
body:
  - type: input
    id: name
    attributes:
      label: Theme name
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Link to the CSS file
      description: A stable URL, ideally pinned to a commit or release.
      placeholder: https://example.com/my-theme.css
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Light and dark, if the theme supports both.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: Built for theme-api 1 (see docs/theme-api.md)
          required: true
        - label: Looks right on the lite effect tier
        - label: Animates only transform and opacity
